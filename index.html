.ct .xb{width:40px;height:40px;border:0;background:transparent;margin:-6px 0 0 -6px;flex:none}.rec .ct .xb{background:transparent;color:#fff}

.cw{margin:12px 0 0;font-size:calc(15px*var(--ts,1));line-height:1.7}
.cb{margin-top:16px}
/* the three kinds stay distinct but calm: white / green tint / sand, no spines or dashes */
.ca{border-inline-start:1px solid var(--bd)}
.cc{background:var(--tint);border:0}
.cp{background:var(--pl-bg);border:0}
.cc .bar{background:var(--card)}
/* recommendation: title, one line why, one main action, quiet feedback row */
.rec{padding:24px}.rec .cd,.rec .cm,.rec .cw{color:#fff}.rec .cd,.rec .cw{opacity:.95}.rec .cm{opacity:.85}
.fbrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin:20px -24px -24px;padding:0 8px;border-top:1px solid rgba(255,255,255,.25)}
.fbrow .fb,.fbrow .fb:nth-child(3){grid-column:auto;background:transparent;border:0;border-radius:0;min-height:52px;padding:0 8px;font-size:calc(15px*var(--ts,1));font-weight:600;color:#fff;white-space:nowrap}
.fbrow .fb+.fb{border-inline-start:1px solid rgba(255,255,255,.25)}
.fbrow .fb[aria-pressed=true]{background:rgba(255,255,255,.18)}.fbrow .fb[aria-pressed=true]::before{content:"✓ "}
.tag,.tag.d{font-size:calc(13px*var(--ts,1))}
.mini .tag{background:transparent;padding:0;color:var(--mu)}
.chev{color:var(--mu)}

/* v13: recommendation feedback = independent buttons */
.rec .fbrow{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0;padding:0;border:0}
.rec .fbrow .fb,.rec .fbrow .fb:nth-child(3){flex:1 1 120px;grid-column:auto;min-height:48px;padding:10px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:calc(16px*var(--ts,1));font-weight:700;line-height:1.3;white-space:normal;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .15s,transform .1s}
.rec .fbrow .fb+.fb{border-inline-start:2px solid rgba(255,255,255,.7)}
.rec .fbrow .fb:first-child{background:#E3F2EB;border-color:#E3F2EB;color:#14402F}
.rec .fbrow .fb:nth-child(3){border-style:dashed}
.rec .fbrow .fb:hover{background:rgba(255,255,255,.22)}.rec .fbrow .fb:first-child:hover{background:#fff}
.rec .fbrow .fb:active{transform:scale(.97)}
.rec .fbrow .fb:focus-visible{outline:3px solid #FFD66B;outline-offset:2px}
.rec .fbrow .fb[aria-pressed=true]{background:#fff;color:#14402F;border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.rec .fbrow .fb::before,.rec .fbrow .fb[aria-pressed=true]::before{content:none!important;display:none}
.rec .fbrow .fb{text-align:center;justify-content:center;align-items:center;gap:0}

4:['التقط خمس صور لشيء جميل تمر عليه في حيّك ولم تنتبه له.',['اخرج في حيّك وابحث عن مشهد أو تفصيل لافت.','التقط كل مشهد من زاويتين مختلفتين.','اختر الأفضل من كل مشهد واحتفظ بخمس صور.'],['يزيد انتباهك للحاضر.','ينمّي حسّ الملاحظة.']],
5:['اجلس مع صديق على فنجان قهوة وتحدثوا بدون جوالات.',['اتفق مع صديق على وقت ومكان يناسبكما.','ضعوا الجوالات بعيداً عن الطاولة.','تذوقوا القهوة ببطء وتحدثوا عن شي غير الدوام.'],['يقوّي الصداقة.','استراحة ذهنية ممتعة.']],
6:['ارسم أو لوّن بحرية لمدة 20 دقيقة بدون أحكام.',['جهّز ورقة وألواناً أو أقلاماً.','ابدأ بأي خط أو شكل ولا تقلق من النتيجة.','توقف بعد 20 دقيقة وانظر إلى ما رسمته.'],['يخفف التوتر.','ينمّي الإبداع.']],
7:['وجبة مع أهلك تتحدثون فيها بدل النظر للشاشات.',['اتفقوا على وقت الوجبة وضعوا الجوالات بعيداً.','شاركوا في تجهيز السفرة.','اسألوا بعض: وش أحلى شي صار اليوم؟'],['حديث حقيقي بين أفراد الأسرة.','يصنع ذكريات مشتركة.']],
8:['زر معلماً ثقافياً أو متحفاً قريباً واكتشف حكايته.',['اختر معلماً أو متحفاً قريباً وتأكد من مواعيد زيارته بنفسك.','تجوّل بدون استعجال وتوقف عند ما يشدّك.','دوّن أو صوّر شيئاً تعلمته لتتذكره.'],['يوسّع الأفق.','يعمّق الانتماء للمكان.']],
9:['شارك بوقتك في مبادرة تطوعية تخدم مجتمعك.',['اختر مبادرة أو جهة تطوعية قريبة وتأكد من مواعيدها.','سجّل وحدد ما تقدر على تقديمه.','بعد المشاركة دوّن ما شعرت به.'],['شعور بالمعنى والانتماء.','تعرّف على أشخاص جدد.']],
10:['تعلّم مهارة صغيرة جديدة في 15 دقيقة.',['اختر مهارة صغيرة: كلمات في لغة جديدة أو حركة أو فكرة.','أبعد المشتتات وركّز عليها فقط.','طبّقها مرة واحدة قبل أن تنتهي.'],['ينمّي مهاراتك.','يقوّي التركيز.']],
11:['مكالمة قصيرة تسلّم فيها على شخص تحبه.',['اختر شخصاً تحبه ولم تكلمه من فترة.','اتصل به واسأله عن حاله.','اسمع أكثر مما تتكلم.'],['تقلل الشعور بالوحدة.','تقوّي العلاقة.']],
12:['نزهة مع أهلك على الواجهة البحرية.',['اتفقوا على وقت مناسب للجميع وتحققوا من حالة الجو.','خذوا معكم ماءً وأغراضاً خفيفة.','امشوا وتحدثوا، واتركوا الجوالات لوقت الصور فقط.'],['هواء طلق وحركة للجميع.','وقت جميل مع الأهل.']],
13:['وقت هادئ للتلاوة أو الورد بعيداً عن الاستعجال.',['اختر مكاناً هادئاً ووقتاً مناسباً.','ابدأ بنية صافية وقراءة هادئة.','خذ وقتك بدون استعجال.'],['يمنح السكينة.','يخفف القلق.']],
14:['اكتب خطة بسيطة لرحلة قريبة في نهاية الأسبوع.',['حدد وجهة قريبة ويوماً مناسباً.','اكتب ما تحتاجه من أغراض وميزانية تقريبية.','شارك الخطة مع من سيرافقك.'],['يمنحك شيئاً تتطلع له.','يحفّزك على التغيير.']],
15:['خمس دقائق من التنفس العميق لتهدئة جسمك.',['اجلس بوضع مريح وأغمض عينيك.','شهيق من الأنف أربع ثوانٍ ثم زفير أطول من الفم.','كرر لخمس دقائق مع التركيز على تنفسك.'],['يهدّي الأعصاب.','يخفف التوتر.']],
16:['خمس عشرة دقيقة هدوء بدون جوال.',['اختر ركناً هادئاً وأبعد الجوال.','اجلس بدون مهمة محددة.','إذا شرد ذهنك، رجّعه إلى تنفسك بلطف.'],['استراحة حقيقية للذهن.','تساعد على استعادة التوازن.']],
17:['لعبة جماعية تجمع العائلة بدون شاشات.',['اختاروا لعبة يعرفها الجميع.','أغلقوا الإشعارات.','العبوا بروح مرحة بدون جدية زايدة.'],['يقوّي الروابط العائلية.','يجلب المرح.']],
18:['وقت في حديقة قريبة مع أهلك.',['اختاروا حديقة قريبة ووقتاً مناسباً.','خذوا ماءً وأغراضاً للعب أو الجلوس.','اقضوا الوقت في اللعب أو الحديث بدون جوالات.'],['هواء طلق للجميع.','وقت جميل مع الأهل.']],
19:['اصنع شيئاً بسيطاً بيدك من أدوات متوفرة عندك.',['اختر شيئاً بسيطاً: رسمة أو مجسماً أو ورقة مطوية.','استخدم ما هو متوفر عندك ولا تهتم بالإتقان.','احتفظ بما صنعته أو أهده لأحد.'],['إنجاز ملموس.','يهدّئ الذهن.']],
20:['جلسة مذاكرة مركّزة بدون جوال.',['حدد موضوعاً واحداً للمذاكرة.','ضع الجوال في غرفة أخرى أو على وضع الطيران.','ذاكر 25 دقيقة متواصلة ثم استرح قليلاً.'],['يقوّي التركيز.','يزيد الإنجاز.']],
21:['فعالية قريبة تذهبون إليها معاً كعائلة.',['اختاروا فعالية قريبة تناسب الجميع وتأكدوا من موعدها بأنفسكم.','اذهبوا معاً وضعوا الجوالات بعيداً.','بعدها تحدثوا عن أكثر شي أعجبكم.'],['ذكريات مشتركة.','وقت جميل للأسرة.']],
22:['اجلس في مكان هادئ تقرأ أو تدوّن بدون جوال.',['اختر مكتبة أو مقهى هادئاً قريباً.','خذ كتاباً أو دفتراً واجلس بدون جوال.','اقرأ أو دوّن لمدة 45 دقيقة.'],['بيئة تساعد على التركيز.','تغيير المكان يجدّد الذهن.']],
23:[0,['اجمع المكونات المتوفرة عندك: عصير أو ماء فوار أو نعناع أو فواكه.','اخلطها بنسب جديدة وتذوّق النكهة.','سمّه باسم من اختيارك وقدّمه لنفسك أو لأحد.'],['تجربة حسية جديدة.','إنجاز صغير ملموس.']],
24:[0,['اخرج في حيّك أو أي مكان قريب.','ابحث عن ثلاثة أشياء لم تلاحظها قبل وصوّرها.','اختر أغربها واحتفظ بها.'],['يزيد انتباهك.','يكسر الروتين.']],
25:[0,['اختر كلمة عشوائية من كتاب أو من شخص بجانبك.','ارسم أول ما يخطر في بالك لعشر دقائق.','لا تمسح ولا تقيّم، فقط ارسم.'],['يحرّرك من الخوف من الخطأ.','يخفف التوتر.']],
26:[0,['اختر شخصاً أثّر فيك أو ساعدك.','اكتب له بخط يدك ما تقدّره فيه.','سلّمها له أو احتفظ بها إن أردت.'],['تقوّي العلاقة.','شعور جميل لك وله.']],
27:[0,['قصّ ورقة بحجم علامة كتاب أو بطاقة.','لوّنها أو زخرفها بما يعجبك.','أهدها لأحد أو استخدمها في كتابك.'],['إنجاز يدوي صغير.','يهدّئ الذهن.']],
28:[0,['اختر وصفة بسيطة وتأكد من توفر المكونات.','نفّذ الخطوات واحدة واحدة وجوالك بعيد.','تذوّق وقيّم النتيجة.'],['إنجاز ملموس.','ينشغل ذهنك بنشاط ممتع.']],
29:[0,['اجمع أصدقاءك أو أهلك واختاروا لعبة.','أغلقوا الإشعارات.','العبوا وتبادلوا التحدي بروح مرحة.'],['يقوّي الروابط.','يجلب الضحك.']],
30:[0,['جهّز ألواناً مائية وورقاً مناسباً وماءً.','اترك الألوان تمتزج على الورقة بحرية.','اترك الرسمة تجف وانظر ماذا ظهر.'],['يخفف التوتر.','يعلّمك تقبّل المفاجآت.']],
31:[0,['جهّزوا عشرة أسئلة بسيطة في موضوع يعرفه الجميع.','قسّموا الأسرة لفريقين أو العبوا فرادى.','احسبوا النقاط واحتفلوا بالفائز.'],['مرح مشترك.','يتعلم الجميع شيئاً جديداً.']],
32:[0,['اختاروا وجبة بسيطة ووزّعوا الأدوار.','اطبخوا معاً والجوالات بعيدة.','اجلسوا لتأكلوا ما صنعتموه.'],['تعاون ممتع.','ذكريات مشتركة.']],
33:[0,['اختر مكاناً مفتوحاً قريباً وتأكد من وقت الغروب.','خذ قهوتك وكرسياً أو سجادة.','اجلس وشاهد الغروب بدون جوال.'],['يهدّي الذهن.','يربطك بالطبيعة.']],
34:[0,['اختر اتجاهاً جديداً قريباً منك.','امشِ بدون سماعات ولاحظ التفاصيل.','ارجع إلى نقطة البداية أو أكمل إن أردت.'],['ترى مكانك بعين جديدة.','يحرّك جسمك.']],
35:[0,['اختر فكرة قصة صغيرة، مثل طريقك إلى القهوة.','صوّر خمس لقطات متتابعة تحكي بدايتها ونهايتها.','رتّبها وانظر هل تحكي القصة.'],['ينمّي الإبداع.','يعلّمك السرد بالصور.']],
36:[0,['اختر حرفاً واحداً وقلماً مناسباً.','اكتبه عدة مرات بأحجام وأشكال مختلفة.','اختر أجمل نسخة واحتفظ بها.'],['يهدّئ الذهن.','يقرّبك من جمال الخط.']],
37:[0,['اختر شكلاً بسيطاً من مقطع أو إرشادات مكتوبة.','اطوِ الورقة خطوة بخطوة بدون استعجال.','جرّب مرة ثانية بشكل مختلف.'],['يركّز الانتباه.','إنجاز صغير ممتع.']],
38:[0,['ابدأ من باب بيتك ومعك عملة.','عند كل تقاطع اقلب العملة: الرأس يميناً والكتابة يساراً.','توقف بعد 20 دقيقة وارجع وانتبه لما رأيت.'],['مغامرة صغيرة بدون تخطيط.','تحرّك جسمك.']],
39:[0,['اختر لوناً واحداً اليوم.','صوّر عشرة أشياء من هذا اللون تقابلك.','اعرض الصور بجانب بعض وانظر كم درجة مختلفة وجدت.'],['ينمّي الملاحظة.','يحوّل المشي العادي إلى لعبة.']],
40:[0,['اختر شخصاً تقدّره.','سجّل رسالة صوتية قصيرة تقول له شيئاً صادقاً.','أرسلها بدون انتظار رد.'],['تقوّي العلاقة.','أدفأ من رسالة مكتوبة سريعة.']],
41:[0,['اختر شيئاً بسيطاً: بيتاً أو وجهاً أو شجرة.','أغمض عينيك وارسمه بدون رفع القلم.','افتح عينيك وانظر النتيجة واضحك.'],['يكسر الخوف من الخطأ.','يمنحك ضحكة صغيرة.']],
42:[0,['اختر بلداً لم تجرّب أكله وابحث عن وصفة بسيطة منه.','اجمعوا المكونات واطبخوها معاً.','تذوّقوها وتحدثوا عن البلد.'],['اكتشاف ثقافة جديدة.','نشاط مشترك ممتع.']],
43:[0,['اخرج قبل الغروب بقليل بحذاء مريح.','امشِ وانتبه للظلال الطويلة.','صوّر الظلال التي تعجبك.'],['مشي هادئ بإضاءة جميلة.','ينمّي حسّ التصوير.']],
44:[0,['اختاروا لعبة جماعية مناسبة لعدد الحاضرين.','ضعوا الجوالات في سلة بعيدة.','العبوا جولات وتبادلوا التحدي.'],['يقوّي الروابط.','وقت ممتع بدون شاشات.']],
45:[0,['ابحث عن ورشة حرفية وتأكد من موعدها وسعرها بنفسك.','احجز أو توجّه إليها.','جرّب بيدك واحتفظ بما صنعته.'],['تجربة جديدة بيدك.','تتعرف على أشخاص يشاركونك الاهتمام.']],
46:[0,['اجلس في مكان هادئ بورقة وقلم.','اكتب ماذا تتمنى وما الذي تشكره اليوم.','اطوِ الرسالة واكتب عليها موعد فتحها.'],['تأمّل فيما يهمك.','هدية لنفسك بعد سنة.']],
47:[0,['اختر حياً قريباً لم تزره.','امشِ فيه بدون خطة محددة.','صوّر ثلاثة أشياء لفتت نظرك.'],['تكتشف مدينتك من جديد.','حركة وهواء.']],
48:[0,['اختر ركناً هادئاً وضع سماعتك.','شغّل أصوات الطبيعة واجلس بدون جوال.','كلما شرد ذهنك رجّعه إلى الأصوات.'],['يهدّي الأعصاب.','استراحة قصيرة للذهن.']]};
